# Pedidos360 - entorno Docker.
#
# Solo infraestructura (MySQL + RabbitMQ), para ejecutar los servicios desde el IDE:
#   docker compose up -d
#
# Stack completo (infraestructura + 6 microservicios), por ejemplo en EC2:
#   docker compose --profile app up -d --build
#
# Las credenciales y API keys se toman de un archivo .env (ver .env.example).
services:
  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # EP3: broker de mensajeria. 5672 = AMQP (microservicios), 15672 = consola Management.
  # EP4: nodo 1 del cluster RabbitMQ (ver docker/rabbitmq-cluster.conf).
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbitmq
    hostname: pedidos360-rabbitmq
    restart: unless-stopped
    environment: &rabbitmq-env
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cluster-cookie}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    healthcheck: &rabbitmq-healthcheck
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # EP4: nodo 2 del cluster. Arranca cuando el nodo 1 esta sano y se une a el.
  rabbitmq-2:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbitmq-2
    hostname: pedidos360-rabbitmq-2
    restart: unless-stopped
    environment: *rabbitmq-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./docker/rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    healthcheck: *rabbitmq-healthcheck

  auth-service:
    profiles: ["app"]
    build:
      context: ./auth-service
      dockerfile: ../docker/spring-service.Dockerfile
    container_name: pedidos360-auth
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smartlogix_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      AUTH_BOOTSTRAP_ADMIN_ENABLED: "true"
    ports:
      - "8082:8082"

  inventario:
    profiles: ["app"]
    build:
      context: ./inventario
      dockerfile: ../docker/spring-service.Dockerfile
    container_name: pedidos360-inventario
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smartlogix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      RABBITMQ_HOST: rabbitmq
      # EP4: lista de nodos del cluster; si el nodo 1 cae, el cliente conmuta al nodo 2.
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      INVENTARIO_API_KEY: ${INVENTARIO_API_KEY:-local-dev-inventory-key}
    ports:
      - "8081:8081"

  pedidos:
    profiles: ["app"]
    build:
      context: ./pedidos
      dockerfile: ../docker/spring-service.Dockerfile
    container_name: pedidos360-pedidos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smartlogix_orders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      RABBITMQ_HOST: rabbitmq
      # EP4: lista de nodos del cluster; si el nodo 1 cae, el cliente conmuta al nodo 2.
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      INVENTORY_SERVICE_URL: http://inventario:8081
      INVENTARIO_API_KEY: ${INVENTARIO_API_KEY:-local-dev-inventory-key}
      AUTH_SERVICE_URL: http://auth-service:8082
      PEDIDOS_API_KEY: ${PEDIDOS_API_KEY:-local-dev-orders-key}
    ports:
      - "8084:8084"

  envios:
    profiles: ["app"]
    build:
      context: ./envios
      dockerfile: ../docker/spring-service.Dockerfile
    container_name: pedidos360-envios
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smartlogix_shipping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      RABBITMQ_HOST: rabbitmq
      # EP4: lista de nodos del cluster; si el nodo 1 cae, el cliente conmuta al nodo 2.
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      ENVIOS_API_KEY: ${ENVIOS_API_KEY:-local-dev-shipping-key}
      ORDERS_SERVICE_URL: http://pedidos:8084
      PEDIDOS_API_KEY: ${PEDIDOS_API_KEY:-local-dev-orders-key}
    ports:
      - "8083:8083"

  # EP3: microservicio administrador de RabbitMQ (colas, exchanges, bindings, DLQ).
  rabbitmq-admin:
    profiles: ["app"]
    build:
      context: ./rabbitmq-admin
      dockerfile: ../docker/spring-service.Dockerfile
    container_name: pedidos360-rabbitmq-admin
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      # EP4: lista de nodos del cluster; si el nodo 1 cae, el cliente conmuta al nodo 2.
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672,rabbitmq-2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBIT_ADMIN_API_KEY: ${RABBIT_ADMIN_API_KEY:-local-dev-rabbit-admin-key}
    ports:
      - "8085:8085"

  api-gateway:
    profiles: ["app"]
    build:
      context: ./api-gateway
      dockerfile: ../docker/spring-service.Dockerfile
    container_name: pedidos360-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - inventario
      - pedidos
      - envios
      - rabbitmq-admin
    environment:
      AUTH_SERVICE_URL: http://auth-service:8082
      INVENTORY_SERVICE_URL: http://inventario:8081
      INVENTARIO_API_KEY: ${INVENTARIO_API_KEY:-local-dev-inventory-key}
      ORDERS_SERVICE_URL: http://pedidos:8084
      PEDIDOS_API_KEY: ${PEDIDOS_API_KEY:-local-dev-orders-key}
      SHIPPING_SERVICE_URL: http://envios:8083
      ENVIOS_API_KEY: ${ENVIOS_API_KEY:-local-dev-shipping-key}
      RABBIT_ADMIN_SERVICE_URL: http://rabbitmq-admin:8085
      RABBIT_ADMIN_API_KEY: ${RABBIT_ADMIN_API_KEY:-local-dev-rabbit-admin-key}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  rabbitmq_data:
  rabbitmq_data_2:
