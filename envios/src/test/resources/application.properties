spring.datasource.url=jdbc:h2:mem:smartlogix_envios_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

shipping.orders-service-url=http://localhost:8084
shipping.orders-api-key=
shipping.orders-api-key-header=X-API-Key
shipping.orders-service-user-id=00000000-0000-0000-0000-000000000000
shipping.orders-service-roles=ADMIN

# EP3: en tests no se inician los listeners RabbitMQ (no se requiere broker).
spring.rabbitmq.listener.simple.auto-startup=false
# =====================================================================
# # EP3 - RabbitMQ: nombres centralizados (MessagingProperties)
# =====================================================================
messaging.exchanges.envios=envios.events
messaging.exchanges.pedidos=pedidos.events
messaging.exchanges.dead-letter=envios.dlx
messaging.routing-keys.envio-creado=envio.creado
messaging.routing-keys.envio-estado-actualizado=envio.estado.actualizado
messaging.routing-keys.pedido-confirmado=pedido.confirmado
messaging.routing-keys.pedido-cancelado=pedido.cancelado
messaging.queues.pedido-confirmado=envios.pedido-confirmado.queue
messaging.queues.pedido-confirmado-retry=envios.pedido-confirmado.retry
messaging.queues.pedido-confirmado-dlq=envios.pedido-confirmado.dlq
messaging.queues.pedido-cancelado=envios.pedido-cancelado.queue
messaging.queues.pedido-cancelado-retry=envios.pedido-cancelado.retry
messaging.queues.pedido-cancelado-dlq=envios.pedido-cancelado.dlq
# Reintentos: 3 intentos totales, 5 s de espera en la cola retry.
messaging.retry.max-attempts=${MESSAGING_RETRY_MAX_ATTEMPTS:3}
messaging.retry.delay-ms=${MESSAGING_RETRY_DELAY_MS:5000}
# Retencion DLQ: 7 dias y maximo 10.000 mensajes.
messaging.dlq.retention-ms=${MESSAGING_DLQ_RETENTION_MS:604800000}
messaging.dlq.max-length=${MESSAGING_DLQ_MAX_LENGTH:10000}
