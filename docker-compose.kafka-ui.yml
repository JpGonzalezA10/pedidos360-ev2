# =====================================================================
# EP5 - Kafka-UI: consola web para administrar brokers, topicos, mensajes y consumer groups.
#
#   docker compose -f docker-compose.kafka.yml -f docker-compose.kafka-ui.yml up -d
#   (o docker compose up -d: docker-compose.yml incluye ambos archivos)
#
# URL: http://<host>:8090  (8080 lo usa el API Gateway). Login con KAFKA_UI_USER / KAFKA_UI_PASSWORD.
# Se conecta a los 3 brokers por el listener INTERNAL y a ZooKeeper para la vista del cluster.
# No declara depends_on para poder levantarse sola sobre un cluster ya en ejecucion (reintenta la conexion).
# =====================================================================

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pedidos360-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      # Permite crear/editar topicos, borrar mensajes y resetear offsets desde la UI.
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-pedidos360}
      JAVA_OPTS: -Xms128m -Xmx384m
