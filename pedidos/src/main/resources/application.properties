spring.application.name=${SPRING_APPLICATION_NAME:pedidos}
spring.profiles.default=dev

server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartlogix_orders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.time_zone=${JPA_TIME_ZONE:UTC}
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

orders.inventory-service-url=${INVENTORY_SERVICE_URL:http://localhost:8081}
orders.inventory-api-key=${INVENTARIO_API_KEY:}
orders.inventory-api-key-header=${INVENTARIO_API_KEY_HEADER:X-API-Key}
orders.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8082}

orders.security.api-key=${PEDIDOS_API_KEY:}
orders.security.header-name=${PEDIDOS_API_KEY_HEADER:X-API-Key}

springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}

# =====================================================================
# EP3 - RabbitMQ: conexion
# =====================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Publisher confirms y returns: el broker confirma cada publicacion.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# Consumidores con ACK manual y procesamiento justo (1 mensaje sin confirmar por consumidor).
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# =====================================================================
# EP3 - RabbitMQ: nombres centralizados (MessagingProperties)
# =====================================================================
messaging.exchanges.pedidos=pedidos.events
messaging.exchanges.envios=envios.events
messaging.exchanges.dead-letter=pedidos.dlx
messaging.routing-keys.pedido-confirmado=pedido.confirmado
messaging.routing-keys.pedido-cancelado=pedido.cancelado
messaging.routing-keys.pedido-estado-actualizado=pedido.estado.actualizado
messaging.routing-keys.envio-estado-actualizado=envio.estado.actualizado
messaging.queues.envio-estado=pedidos.envio-estado.queue
messaging.queues.envio-estado-retry=pedidos.envio-estado.retry
messaging.queues.envio-estado-dlq=pedidos.envio-estado.dlq
messaging.queues.notificaciones-cliente=pedidos.notificaciones-cliente.queue
messaging.queues.notificaciones-cliente-retry=pedidos.notificaciones-cliente.retry
messaging.queues.notificaciones-cliente-dlq=pedidos.notificaciones-cliente.dlq
# Reintentos: 3 intentos totales, 5 s de espera en la cola retry.
messaging.retry.max-attempts=${MESSAGING_RETRY_MAX_ATTEMPTS:3}
messaging.retry.delay-ms=${MESSAGING_RETRY_DELAY_MS:5000}
# Retencion DLQ: 7 dias y maximo 10.000 mensajes.
messaging.dlq.retention-ms=${MESSAGING_DLQ_RETENTION_MS:604800000}
messaging.dlq.max-length=${MESSAGING_DLQ_MAX_LENGTH:10000}
