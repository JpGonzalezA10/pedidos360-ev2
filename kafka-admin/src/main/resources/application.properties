spring.application.name=${SPRING_APPLICATION_NAME:kafka-admin}
server.port=${SERVER_PORT:8086}

# =====================================================================
# Conexion al cluster Kafka (AdminClient via KafkaAdmin de Spring Boot)
# =====================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=${spring.application.name}
spring.kafka.admin.properties.request.timeout.ms=10000
spring.kafka.admin.properties.default.api.timeout.ms=15000
# El administrador no declara topicos propios al iniciar.
spring.kafka.admin.auto-create=false

# =====================================================================
# Configuracion centralizada del administrador (KafkaAdminProperties)
# =====================================================================
# Prefijos internos que la API nunca crea, modifica ni elimina (__consumer_offsets, _schemas, etc.).
kafka-admin.protected-prefixes=__,_confluent,_schemas
# Configuraciones de topico que la API permite definir o modificar.
kafka-admin.allowed-topic-configs=cleanup.policy,retention.ms,retention.bytes,min.insync.replicas,\
  segment.ms,segment.bytes,max.message.bytes,compression.type,delete.retention.ms,\
  min.compaction.lag.ms,max.compaction.lag.ms,min.cleanable.dirty.ratio,message.timestamp.type,unclean.leader.election.enable
kafka-admin.dead-letter-suffix=.DLT
kafka-admin.operation-timeout-ms=15000
kafka-admin.max-replication-factor=3
kafka-admin.max-partitions=50
# Reprocesamiento de DLT: consumer group propio (recuerda lo ya reprocesado) y lote maximo.
kafka-admin.reprocess.group-id=kafka-admin-dlt-reprocessor
kafka-admin.reprocess.max-messages=500
kafka-admin.reprocess.poll-timeout-ms=2000

# Seguridad interna: el API Gateway envia esta clave (vacia = deshabilitado en dev local).
kafka-admin.security.api-key=${KAFKA_ADMIN_API_KEY:}
kafka-admin.security.header-name=${KAFKA_ADMIN_API_KEY_HEADER:X-API-Key}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
