spring.application.name=${SPRING_APPLICATION_NAME:rabbitmq-admin}
server.port=${SERVER_PORT:8085}

# =====================================================================
# Conexion AMQP (RabbitAdmin declara y elimina recursos)
# =====================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# =====================================================================
# Configuracion centralizada del administrador (RabbitAdminProperties)
# =====================================================================
# Management HTTP API: listados, estadisticas e inspeccion de mensajes.
rabbit-admin.management.url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
rabbit-admin.management.username=${RABBITMQ_USERNAME:pedidos360}
rabbit-admin.management.password=${RABBITMQ_PASSWORD:pedidos360}
rabbit-admin.management.virtual-host=${RABBITMQ_VHOST:/}
# Prefijos reservados que la API nunca crea ni elimina.
rabbit-admin.protected-prefixes=amq.
# Sufijo que identifica a las Dead Letter Queues para el monitoreo y las alertas.
rabbit-admin.dead-letter-suffix=.dlq

# Seguridad interna: el API Gateway envia esta clave (vacia = deshabilitado en dev local).
rabbit-admin.security.api-key=${RABBIT_ADMIN_API_KEY:}
rabbit-admin.security.header-name=${RABBIT_ADMIN_API_KEY_HEADER:X-API-Key}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
