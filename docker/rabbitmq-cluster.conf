# EP4 - Cluster RabbitMQ de 2 nodos (formacion automatica al arrancar).
# El nodo 2 descubre al nodo 1 por esta lista y se une al cluster; ambos comparten
# la cookie de Erlang (RABBITMQ_ERLANG_COOKIE en docker-compose.yml).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@pedidos360-rabbitmq
cluster_formation.classic_config.nodes.2 = rabbit@pedidos360-rabbitmq-2
