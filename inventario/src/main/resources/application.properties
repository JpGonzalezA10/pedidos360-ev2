spring.application.name=${SPRING_APPLICATION_NAME:inventario}
spring.profiles.default=dev
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.open-in-view=false
# EP5: si la BD no responde, falla en 5 s (en vez de 30 s) para que el consumidor Kafka reintente con backoff.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

inventory.security.api-key=${INVENTARIO_API_KEY:}
inventory.security.header-name=${INVENTARIO_API_KEY_HEADER:X-API-Key}

springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
# =====================================================================
# EP3 - RabbitMQ: conexion
# =====================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Publisher confirms y returns: el broker confirma cada publicacion.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# Consumidores con ACK manual y procesamiento justo (1 mensaje sin confirmar por consumidor).
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# =====================================================================
# EP3 - RabbitMQ: nombres centralizados (MessagingProperties)
# =====================================================================
messaging.exchanges.inventario=inventario.events
messaging.exchanges.pedidos=pedidos.events
messaging.exchanges.dead-letter=inventario.dlx
messaging.routing-keys.stock-bajo=inventario.stock.bajo
messaging.routing-keys.pedido-confirmado=pedido.confirmado
messaging.queues.pedido-confirmado=inventario.pedido-confirmado.queue
messaging.queues.pedido-confirmado-retry=inventario.pedido-confirmado.retry
messaging.queues.pedido-confirmado-dlq=inventario.pedido-confirmado.dlq
messaging.queues.alertas-stock=inventario.alertas-stock.queue
messaging.queues.alertas-stock-retry=inventario.alertas-stock.retry
messaging.queues.alertas-stock-dlq=inventario.alertas-stock.dlq
# Reintentos: 3 intentos totales, 5 s de espera en la cola retry.
messaging.retry.max-attempts=${MESSAGING_RETRY_MAX_ATTEMPTS:3}
messaging.retry.delay-ms=${MESSAGING_RETRY_DELAY_MS:5000}
# Retencion DLQ: 7 dias y maximo 10.000 mensajes.
messaging.dlq.retention-ms=${MESSAGING_DLQ_RETENTION_MS:604800000}
messaging.dlq.max-length=${MESSAGING_DLQ_MAX_LENGTH:10000}

# =====================================================================
# EP5 - Apache Kafka: cliente (bootstrap, serializers, producer y consumer)
# =====================================================================
# Los 3 brokers del cluster (docker-compose.kafka.yml). Basta con uno vivo para descubrir el resto.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=${spring.application.name}

# --- Productor: JSON tipado con DTOs, entrega segura e idempotente ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# acks=all: el lider y todas las replicas en sincronia (ISR) confirman la escritura.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=60000
spring.kafka.producer.properties.request.timeout.ms=15000
# Tuning (guia 3.3.2): lotes de 32 KB, espera de 20 ms para llenarlos y compresion lz4.
spring.kafka.producer.batch-size=32768
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.linger.ms=20
# El tipo Java no viaja en headers: cada microservicio deserializa a su propio DTO.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Consumidor: ErrorHandlingDeserializer evita el bucle infinito ante JSON invalido ---
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.api.inventario.streaming.message.OrderEventMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.api.inventario.streaming.message
# Grupo nuevo lee desde el inicio; commit manual por registro (ack-mode=record) tras procesar.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.isolation-level=read-committed
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
# Rebalanceo cooperativo: al entrar/salir un consumidor solo se mueven las particiones necesarias.
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.listener.ack-mode=record
spring.kafka.listener.auto-startup=${KAFKA_LISTENERS_ENABLED:true}
spring.kafka.listener.missing-topics-fatal=false

# --- Admin: crea los topicos declarados (KafkaTopicConfig) y alinea su configuracion ---
spring.kafka.admin.modify-topic-configs=true
spring.kafka.admin.fail-fast=false

# =====================================================================
# EP5 - Apache Kafka: topicos, consumer groups, DLT y reintentos (StreamingProperties)
# =====================================================================
# Topico propio: ultima foto de stock por SKU (key=sku).
# cleanup.policy=compact: Kafka conserva el ultimo valor de cada SKU (como una tabla); min.compaction.lag
# deja 1 minuto de historial sin compactar y delete.retention.ms mantiene 1 dia los tombstones.
streaming.topics.inventario-stock.name=pedidos360.inventario.stock
streaming.topics.inventario-stock.partitions=3
streaming.topics.inventario-stock.replicas=${KAFKA_REPLICATION_FACTOR:3}
streaming.topics.inventario-stock.configs.[cleanup.policy]=compact
streaming.topics.inventario-stock.configs.[min.compaction.lag.ms]=60000
streaming.topics.inventario-stock.configs.[delete.retention.ms]=86400000
streaming.topics.inventario-stock.configs.[segment.ms]=3600000
streaming.topics.inventario-stock.configs.[min.cleanable.dirty.ratio]=0.1
streaming.topics.inventario-stock.configs.[min.insync.replicas]=${KAFKA_MIN_INSYNC_REPLICAS:2}
# Topico ajeno (dueno: pedidos) que inventario consume. Se declara aqui solo para su DLT.
streaming.topics.pedidos-eventos.name=pedidos360.pedidos.eventos
streaming.topics.pedidos-eventos.partitions=3
streaming.topics.pedidos-eventos.replicas=${KAFKA_REPLICATION_FACTOR:3}
# Consumer group de inventario: analitica de demanda por SKU.
streaming.consumer-groups.demanda=inventario-demanda
streaming.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
# DLT: <topico>.DLT, retencion de 14 dias para auditoria y reprocesamiento.
streaming.dead-letter.suffix=.DLT
streaming.dead-letter.replicas=${KAFKA_REPLICATION_FACTOR:3}
streaming.dead-letter.configs.[cleanup.policy]=delete
streaming.dead-letter.configs.[retention.ms]=1209600000
streaming.dead-letter.configs.[min.insync.replicas]=${KAFKA_MIN_INSYNC_REPLICAS:2}
# Reintentos bloqueantes con backoff exponencial: 1 s, 2 s, 4 s (3 reintentos) y luego DLT.
streaming.retry.max-retries=3
streaming.retry.initial-interval-ms=1000
streaming.retry.multiplier=2.0
streaming.retry.max-interval-ms=8000

# Logging contextual: cada linea incluye el correlation-id del evento y el registro Kafka.
logging.pattern.level=%5p [cid:%X{correlationId:-} rec:%X{kafkaRecord:-}]
